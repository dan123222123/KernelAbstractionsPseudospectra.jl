[extensions]
AMDGPUPseudospectra = "AMDGPU"
CUDAPseudospectra = "CUDA"
# Two MultiFloat extensions by design: the warp-shuffle fix needs only MultiFloats (and GPU
# kernels miscompile without it, Schur or no Schur), while the BigFloat Schur reduction also
# needs GenericSchur. Extensions can't force a second weakdep to load, so merging would drop
# the shuffle fix for anyone who loads MultiFloats alone.
GenericSchurPseudospectra = ["GenericSchur", "MultiFloats"]
MetalPseudospectra = "Metal"
MultiFloatsPseudospectra = "MultiFloats"
RecipesBasePseudospectra = "RecipesBase"
oneAPIPseudospectra = "oneAPI"

[compat]
