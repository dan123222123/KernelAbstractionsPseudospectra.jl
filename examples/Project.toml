name = "KernelAbstractionsPseudospectraExamples"
version = "0.1.0"
authors = ["Dan Folescu"]

# CPU-only and plot-ready: instantiates on any machine without GPU drivers. The GPU
# backends (CUDA/AMDGPU/Metal/oneAPI) are intentionally NOT listed — they reach the package
# through weakdep extensions, so add the one you have with `Pkg.add("CUDA")` (etc.) and
# uncomment the matching backend line in a script. See examples/README.md → "Running on a GPU".
[deps]
GenericLinearAlgebra = "14197337-ba66-59df-a3e3-ca00e7dcff7a"
GenericSchur = "c145ed77-6b09-5dd9-b285-bf645a82121e"
KernelAbstractionsPseudospectra = "8b8afa22-3073-43c5-8823-151938199226"
KernelAbstractions = "63c18a36-062a-441e-b654-da1e3ab1ce7c"
LaTeXStrings = "b964fa9f-0449-5b57-a5c2-d3ea65f4040f"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
MatrixDepot = "b51810bb-c9f3-55da-ae3c-350fc1fbce05"
MultiFloats = "bdf0d083-296b-4888-a5b6-7498122e68a5"
Plots = "91a5bcdd-55d7-5caf-9e0b-520d859cae80"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"

[sources]
KernelAbstractionsPseudospectra = {path = ".."}
